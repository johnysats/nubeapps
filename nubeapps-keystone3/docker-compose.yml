version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-keystone3_web_1
      APP_PORT: 80

  # Router: / -> carcasa web del simulador, /files -> explorador de la MicroSD.
  # Misma imagen que nubeapps-ccq1: su nginx ya rutea a sim:6080 y files:80.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.1QX@sha256:517c60cd3500766e6fda620d66ab612e6afa63cd2d6d37bbeac9b85c7fbc8eb6
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/keystone3-sim:3.0.4
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      KSEMU_PORT: "6080"
    volumes:
      # /data/assets es la carpeta que el firmware ve como su unidad "C:": la flash
      # simulada (PIN, billetera, ajustes) y el archivo con los QR que le pasa la camara.
      - ${APP_DATA_DIR}/data/work/assets:/data/assets
      # Y adentro, la MicroSD: monta anidada para que sea la misma carpeta que ve /files.
      - ${APP_DATA_DIR}/data/work/microsd:/data/assets/sd

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/microsd:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
