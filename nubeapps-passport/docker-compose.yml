version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-passport_web_1
      APP_PORT: 80

  # Router: / -> carcasa web del simulador, /files -> explorador de la MicroSD.
  # Misma imagen que nubeapps-ccq1: su nginx ya rutea a sim:6080 y files:80.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.1QX@sha256:517c60cd3500766e6fda620d66ab612e6afa63cd2d6d37bbeac9b85c7fbc8eb6
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/passport-sim:2.3.11-3@sha256:84fdf788373cc0a463591e9768ea1d3b774efa59ef3bba5befad919dda1054af
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      # settings.json de Passport queda en la raiz de /data/work; la MicroSD (lo que
      # expone /files) en /data/work/microsd.
      PASSPORT_DATA_DIR: /data
      PASSPORT_WEB_PORT: "6080"
    volumes:
      - ${APP_DATA_DIR}/data/work:/data/work

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/microsd:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
