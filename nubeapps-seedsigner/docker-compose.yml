version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-seedsigner_web_1
      APP_PORT: 80

  # Router: / -> carcasa web del simulador, /files -> explorador de la MicroSD.
  # Misma imagen que nubeapps-ccq1: su nginx ya rutea a sim:6080 y files:80.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.0QX-3@sha256:c376a4fe5d09fcb9175e216209176ba020ddc4ab7ad4b46aee471d27a01adb3f
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/seedsigner-sim:0.8.7-3@sha256:0063b19c280ae317ef0681f377882b894263c46b3f70a2bd15abf01509f000b0
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      # settings.json de seedsigner queda en la raiz de /data; los archivos que ve la
      # camara (y que expone /files) en /data/MicroSD.
      SSEMU_DATA_DIR: /data
      SSEMU_SD_DIR: /data/MicroSD
      SSEMU_PORT: "6080"
    volumes:
      - ${APP_DATA_DIR}/data/work:/data

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/MicroSD:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
