manifestVersion: 1
id: nubeapps-seedsigner
category: Bitcoin
name: SeedSigner Simulator
version: "0.8.7-3"
tagline: SeedSigner firmware in your browser, no Raspberry Pi / El firmware de SeedSigner en tu navegador, sin Raspberry Pi
description: >-
  WARNING: this is a simulator for learning and testing. It is not a secure wallet, it does not
  run air-gapped, and the entropy of any seed it generates is not safe to hold funds. Never
  import a real seed and never sign with real funds.


  It runs the SeedSigner firmware (upstream, unpatched) inside Umbrel and shows it in your
  browser with the device's joystick and its three keys. It also responds to the keyboard:
  arrows to move, Enter to select, 1/2/3 for KEY1/KEY2/KEY3.


  SeedSigner has no file input or output: everything comes in through the camera scanning QRs.
  Since a container has no camera, the simulator ships a virtual camera fed from the file
  explorer at /files:


  - Upload the PSBT (or a SeedQR, a descriptor, a QR image) to the folder

  - Pick which file the camera points at from that same page

  - Go to Scan on the device and scan it like you would with the real hardware

  - Sign: the signed PSBT comes out as an animated QR on screen, and is also written as
    <name>-signed.psbt so you can download it from /files


  --- En espanol ---


  ATENCION: esto es un simulador para aprender y probar. No es una billetera segura, no corre
  en hardware air-gapped y la entropia de las seeds que genere no sirve para custodiar fondos.
  Nunca importes una seed real ni firmes con fondos reales.


  Corre el firmware de SeedSigner (upstream, sin parches) dentro de Umbrel y lo muestra en el
  navegador con el joystick y las tres teclas del dispositivo. Tambien responde al teclado:
  flechas para moverte, Enter para seleccionar, 1/2/3 para KEY1/KEY2/KEY3.


  SeedSigner no tiene entrada ni salida por archivos: todo entra por la camara escaneando QRs.
  Como en un contenedor no hay camara, el simulador trae una camara virtual alimentada desde el
  explorador de archivos en /files:


  - Subis el PSBT (o un SeedQR, un descriptor, una imagen de QR) a la carpeta

  - Elegis a que archivo apunta la camara desde la misma pagina

  - Entras a Scan en el dispositivo y lo escaneas como lo harias con el hardware real

  - Firmas: el PSBT firmado sale como QR animado en pantalla y ademas queda como
    <nombre>-signed.psbt para descargarlo desde /files
releaseNotes: >-
  Adds an ES|EN toggle to the simulator page (top right, both languages always visible). The
  page around the device -- camera panel, MicroSD help, buttons -- can now be read in English or
  Spanish; the app description already was, this closes the gap for the page itself. What the
  firmware draws on the emulated screen is unaffected: SeedSigner's own UI has its own language
  setting, unrelated to this toggle.

  No firmware change: same simulator, same controls, same data.


  --- En espanol ---


  Suma un selector ES|EN a la pagina del simulador (arriba a la derecha, los dos idiomas
  siempre a la vista). La pagina alrededor del dispositivo -panel de camara, ayuda de la
  MicroSD, botones- ahora se puede leer en espanol o ingles; la descripcion de la app ya lo
  estaba, esto cierra la diferencia en la pagina misma. Lo que el firmware dibuja en la pantalla
  emulada no cambia: la UI propia de SeedSigner tiene su propio ajuste de idioma, sin relacion
  con este selector.

  Sin cambios de firmware: mismo simulador, mismos controles, mismos datos.
