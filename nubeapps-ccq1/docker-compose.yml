version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-ccq1_web_1
      APP_PORT: 80

  # Router: / -> noVNC del simulador, /files -> explorador de la MicroSD.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.0QX@sha256:TBD
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/ccq1-simulator:6.6.0QX@sha256:TBD
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      # Escritorio virtual: tiene que entrar la ventana del sim (518x853 en +100+100) y el
      # xterm del REPL. Lo que se exporta por VNC es solo el recorte de la ventana.
      SCREEN: 640x1024x24
      # -l = PIN 12-12 sin seed. Sin -l el simulador arranca con una seed de test publica.
      SIM_ARGS: --q1 -l
    volumes:
      - ${APP_DATA_DIR}/data/work:/sim/firmware/unix/work

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/MicroSD:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
