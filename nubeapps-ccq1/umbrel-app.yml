name: Coldcard Q1 Simulator
version: "6.6.1QX-3"
tagline: The official Coldcard Q1 simulator in your browser / El simulador oficial de la Coldcard Q1, en tu navegador
description: >-
  WARNING: this is a simulator for learning and testing. It is not a secure wallet and it does
  not run on secure hardware. Never import a real seed and never sign with real funds.


  It runs the official Coldcard Q1 simulator (upstream Coinkite firmware, compiled as-is) inside
  Umbrel and shows it in your browser. The keypad and the touchscreen work with your keyboard
  and your mouse.


  The packaged firmware is 6.6.1QX, from Coldcard's Edge line, which supports MiniScript. You
  can import a descriptor and try out inheritance and timelock policies with wallets like Liana
  and Nunchuk, signing their PSBTs over the simulated MicroSD.


  It also includes a file explorer at /files over the simulated MicroSD card, for the PSBT flow:


  - Upload the unsigned PSBT to the MicroSD from your browser

  - Sign it in the simulator just like you would on the real device

  - Download the signed PSBT from that same explorer


  The QR flow works from the same explorer: open the scanner on the device and upload the file
  to the QR-Camara folder, and the firmware takes it as a scan (PSBT, seed words, SeedQR or any
  text).


  It boots with no seed and PIN 12-12 (the simulator's -l flag). The seed is imported by hand
  from the device menu.


  --- En espanol ---


  ATENCION: esto es un simulador para aprender y probar. No es una billetera segura y no corre
  en hardware seguro. Nunca importes una seed real ni firmes con fondos reales.


  Corre el simulador oficial de la Coldcard Q1 (firmware upstream de Coinkite, compilado tal
  cual) dentro de Umbrel y lo muestra en el navegador. Teclado y pantalla tactil funcionan con
  el teclado y el mouse.


  El firmware empaquetado es el 6.6.1QX, de la linea Edge de Coldcard, que soporta MiniScript.
  Podes importar un descriptor y probar politicas de herencia y timelocks con billeteras como
  Liana y Nunchuk, firmando sus PSBTs por la MicroSD simulada.


  Incluye un explorador de archivos en /files sobre la tarjeta MicroSD simulada, para el flujo
  de PSBTs:


  - Subis el PSBT sin firmar a la MicroSD desde el navegador

  - Lo firmas en el simulador como lo harias en el dispositivo real

  - Descargas el PSBT firmado desde el mismo explorador


  El flujo por QR sale del mismo explorador: abris el escaner en el dispositivo y subis el
  archivo a la carpeta QR-Camara, y el firmware lo toma como un escaneo (PSBT, palabras de la
  seed, SeedQR o cualquier texto).


  Arranca sin seed, con PIN 12-12 (flag -l del simulador). La seed se importa a mano desde el
  menu del dispositivo.
releaseNotes: >-
  Follow-up to the previous update: if an app still opened another NubeApps simulator's
  screen after updating, it was your browser showing a copy it had saved while the bug was
  active. The simulator page is now sent with an explicit "check with the server first"
  header, so the browser can no longer keep a stale page like that.


  If you still see the wrong device, open that app and force a reload once: Ctrl+Shift+R
  (Cmd+Shift+R on Mac).


  No firmware change: same simulator, same controls, same data.


  --- En espanol ---


  Complemento de la actualizacion anterior: si despues de actualizar una app seguia abriendo
  la pantalla de otro simulador de NubeApps, era tu navegador mostrando una copia que habia
  guardado mientras estaba el bug. La pagina del simulador ahora sale con un encabezado que le
  pide al navegador consultar siempre al servidor, asi ya no puede quedarse con una pagina
  vieja de esa forma.


  Si todavia ves el dispositivo equivocado, abri esa app y forza la recarga una vez:
  Ctrl+Shift+R (Cmd+Shift+R en Mac).


  Sin cambios de firmware: mismo simulador, mismos controles, mismos datos.
