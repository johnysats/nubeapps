id: nubeapps-jadeplus
category: Bitcoin
name: Jade Plus Simulator
version: "1.0.41-3"
tagline: Blockstream Jade firmware in your browser, no device / El firmware de Blockstream Jade en tu navegador, sin dispositivo
description: >-
  WARNING: this is a simulator for learning and testing. It is not a secure wallet, it does not
  run air-gapped, and the entropy of any seed it generates is not safe to hold funds. Never
  import a real seed and never sign with real funds.


  It runs the official Blockstream Jade firmware (upstream, unpatched) inside Umbrel: the real
  ESP32 firmware executing in the QEMU emulator that Blockstream ships in the Jade repository,
  with the 320x170 screen of the Jade Plus. You drive it from the page with the three controls
  of the device: the wheel each way and the front button (or the keyboard: arrows move, Enter
  selects).


  There is no webcam in a container, so a virtual camera shows the device a QR made from the
  file you pick on the page: a PSBT goes as an animated UR crypto-psbt, a file with 12 or 24
  words goes as a SeedQR, and anything else as plain text. Upload and download files from
  /files, the explorer in the top right corner.


  The emulated flash persists in the app data, so the PIN, the encrypted seed and the settings
  survive a restart, exactly like the real device.


  --- En espanol ---


  ATENCION: esto es un simulador para aprender y probar. No es una billetera segura, no corre
  en hardware air-gapped y la entropia de las seeds que genere no sirve para custodiar fondos.
  Nunca importes una seed real ni firmes con fondos reales.


  Corre el firmware oficial de Blockstream Jade (upstream, sin parches) dentro de Umbrel: el
  firmware real de ESP32 ejecutandose en el emulador QEMU que Blockstream publica en el
  repositorio de Jade, con la pantalla de 320x170 del Jade Plus. Lo manejas desde la pagina con
  los tres controles del dispositivo: la rueda para cada lado y el boton frontal (o el teclado:
  las flechas mueven y Enter selecciona).


  En un contenedor no hay webcam, asi que una camara virtual le muestra al dispositivo un QR
  armado con el archivo que elegis en la pagina: un PSBT va como UR crypto-psbt animado, un
  archivo con 12 o 24 palabras va como SeedQR, y cualquier otra cosa como texto plano. Subis y
  bajas archivos desde /files, el explorador de arriba a la derecha.


  La flash emulada se guarda en los datos de la app, asi que el PIN, la seed cifrada y la
  configuracion sobreviven a un reinicio, igual que en el dispositivo real.
releaseNotes: >-
  Adds an ES|EN toggle to the simulator page (top right, both languages always visible). The
  page around the device -- camera panel, MicroSD help, buttons -- can now be read in English or
  Spanish; the app description already was, this closes the gap for the page itself. What the
  firmware draws on the emulated screen is unaffected: Jade's own UI is not translated.


  No firmware change: still Blockstream Jade 1.0.41, same controls, same emulated flash, so your
  PIN and the seed stored in the simulator survive the update.


  --- En espanol ---


  Suma un selector ES|EN a la pagina del simulador (arriba a la derecha, los dos idiomas
  siempre a la vista). La pagina alrededor del dispositivo -panel de camara, ayuda de la
  MicroSD, botones- ahora se puede leer en espanol o ingles; la descripcion de la app ya lo
  estaba, esto cierra la diferencia en la pagina misma. Lo que el firmware dibuja en la pantalla
  emulada no cambia: la UI propia del Jade no se traduce.


  Sin cambios de firmware: sigue siendo Blockstream Jade 1.0.41, mismos controles, mismo flash
  emulado, asi que el PIN y la seed guardados en el simulador sobreviven a la actualizacion.
