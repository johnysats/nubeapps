version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-jadeplus_web_1
      APP_PORT: 80

  # Router: / -> carcasa web del simulador, /files -> explorador de archivos.
  # Misma imagen que nubeapps-ccq1: su nginx ya rutea a sim:6080 y files:80.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.0QX-2@sha256:78efcccd49295b1fe94b3eeecc49b884713bf69fcd47652547987e51cf9c5de3
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/jade-sim:1.0.41-2@sha256:ddfd7cede52ca2c1e61b7cf57189721d693c4cb7b451b8c8c01eb90a415330e5
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      # /data guarda la flash y los efuses emulados: ahi viven el PIN, la seed cifrada y
      # los ajustes del dispositivo, o sea que se copian una vez y sobreviven al reinicio.
      JADE_DATA_DIR: /data
      JADE_FILES_DIR: /data/files
      JADE_WEB_PORT: "6080"
    volumes:
      - ${APP_DATA_DIR}/data/work:/data

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/files:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
