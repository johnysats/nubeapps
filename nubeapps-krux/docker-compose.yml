version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-krux_web_1
      APP_PORT: 80

  # Router: / -> carcasa web del simulador, /files -> explorador de la MicroSD.
  # Misma imagen que nubeapps-ccq1: su nginx ya rutea a sim:6080 y files:80.
  web:
    image: ghcr.io/johnysats/ccq1-web:6.6.0QX-4@sha256:7b26b08a1b31549deb64f0dd2c0e66031088507d218312b3c499be34b81c9960
    restart: on-failure
    depends_on:
      - sim
      - files

  sim:
    image: ghcr.io/johnysats/krux-sim:26.08.0-3@sha256:ce7ed84bc152e16f85f6e3c3e664c801cabb8bd17984c2dedc56c492fd0b01ff
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      # /data/sd es la MicroSD (lo que expone /files) y /data/flash la memoria interna
      # del K210, donde krux guarda settings y mnemonics encriptados.
      KXEMU_DATA_DIR: /data
      KXEMU_SD_DIR: /data/sd
      # Amigo: es el unico con pantalla tactil grande, que es lo que se puede manejar
      # bien desde el navegador. El resto de los modelos son a botones.
      KXEMU_DEVICE: maixpy_amigo
      KXEMU_PORT: "6080"
    volumes:
      - ${APP_DATA_DIR}/data/work:/data

  files:
    image: filebrowser/filebrowser:v2.44.0@sha256:f63369420687482dfdf252f80ef675f44ca1d1cd3a631261fb424136214fe629
    user: "1000:1000"
    restart: on-failure
    environment:
      # sin auth propia: la app ya esta detras del login de Umbrel via app_proxy
      FB_NOAUTH: "true"
      FB_BASEURL: /files
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data/work/sd:/srv
      - ${APP_DATA_DIR}/data/filebrowser:/database
