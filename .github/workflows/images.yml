name: Build app images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # tag del firmware upstream que se compila dentro de la imagen del simulador
  FIRMWARE_TAG: 2026-07-31T1605-v6.6.0QX
  SIM_VERSION: 6.6.0QX
  # firmware de SeedSigner: no se compila nada nativo, solo se clona por tag
  SEEDSIGNER_TAG: "0.8.7"

jobs:
  # El simulador compila el firmware: runners nativos por arquitectura, no QEMU.
  simulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/ccq1-simulator
          platforms: ${{ matrix.platform }}
          build-args: FIRMWARE_TAG=${{ env.FIRMWARE_TAG }}
          cache-from: type=gha,scope=sim-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=sim-${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/ccq1-simulator,push-by-digest=true,name-canonical=true,push=true

      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  simulator-manifest:
    needs: simulator
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${REGISTRY}/${{ steps.vars.outputs.owner }}/ccq1-simulator"
          docker buildx imagetools create -t "${IMAGE}:${SIM_VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${SIM_VERSION}"

  # Solo COPY sobre nginx:alpine: no necesita runner nativo ni QEMU.
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/ccq1-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/ccq1-web:${{ env.SIM_VERSION }}

  # Simulador de SeedSigner: solo clona el firmware (python puro) e instala wheels,
  # asi que buildx con QEMU alcanza y no hacen falta runners por arquitectura.
  seedsigner:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/seedsigner-sim
          platforms: linux/amd64,linux/arm64
          build-args: SEEDSIGNER_TAG=${{ env.SEEDSIGNER_TAG }}
          cache-from: type=gha,scope=seedsigner
          cache-to: type=gha,mode=max,scope=seedsigner
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/seedsigner-sim:${{ env.SEEDSIGNER_TAG }}
