name: Build app images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "versions.yml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Las versiones upstream viven en versions.yml (una sola fuente de verdad) y salen
  # de aca como outputs para el resto de los jobs.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.v.outputs.owner }}
      firmware_tag: ${{ steps.v.outputs.firmware_tag }}
      sim_version: ${{ steps.v.outputs.sim_version }}
      seedsigner_tag: ${{ steps.v.outputs.seedsigner_tag }}
      krux_tag: ${{ steps.v.outputs.krux_tag }}
      krux_version: ${{ steps.v.outputs.krux_version }}
      jade_tag: ${{ steps.v.outputs.jade_tag }}
      seedtool_tag: ${{ steps.v.outputs.seedtool_tag }}
      # Que reconstruir en este push: ver el paso "changed".
      build_sim: ${{ steps.changed.outputs.sim }}
      build_web: ${{ steps.changed.outputs.web }}
      build_seedsigner: ${{ steps.changed.outputs.seedsigner }}
      build_krux: ${{ steps.changed.outputs.krux }}
      build_jade: ${{ steps.changed.outputs.jade }}
      build_seedtool: ${{ steps.changed.outputs.seedtool }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "firmware_tag=$(yq '.firmwares.ccq1.tag' versions.yml)"
            echo "sim_version=$(yq '.firmwares.ccq1.version' versions.yml)"
            echo "seedsigner_tag=$(yq '.firmwares.seedsigner.tag' versions.yml)"
            echo "krux_tag=$(yq '.firmwares.krux.tag' versions.yml)"
            echo "krux_version=$(yq '.firmwares.krux.version' versions.yml)"
            echo "jade_tag=$(yq '.firmwares.jade.tag' versions.yml)"
            echo "seedtool_tag=$(yq '.firmwares.seedtool.tag' versions.yml)"
          } >> "$GITHUB_OUTPUT"

      # Cada imagen se reconstruye solo si cambio algo suyo: su contexto en images/ o el
      # tag/version que empaqueta. Sin esto, tocar una sola app repinnea los digests de
      # todas (las imagenes no son reproducibles byte a byte) y mete en el commit cuatro
      # cambios que nadie probo. Fuera de un push -dispatch manual, rama nueva o sin
      # historial- se reconstruye todo, igual que antes.
      # Al agregar una app: sumarle aca su linea con el contexto y su clave de versions.yml.
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          elif ! git diff --quiet "${BEFORE}" HEAD -- .github/workflows/images.yml; then
            # Si cambio el workflow mismo, no se puede saber a que imagen afecta.
            all=true
          fi

          changed() {  # $1 = contexto de build, $2 = clave en versions.yml
            if [ "$all" = true ] || ! git diff --quiet "${BEFORE}" HEAD -- "$1"; then
              echo true; return
            fi
            old=$(git show "${BEFORE}:versions.yml" 2>/dev/null | yq ".firmwares.$2 | [.tag, .version] | join(\" \")" - || echo "")
            new=$(yq ".firmwares.$2 | [.tag, .version] | join(\" \")" versions.yml)
            if [ "$old" = "$new" ]; then echo false; else echo true; fi
          }

          {
            echo "sim=$(changed images/ccq1-simulator ccq1)"
            echo "web=$(changed images/ccq1-web ccq1)"
            echo "seedsigner=$(changed images/seedsigner-sim seedsigner)"
            echo "krux=$(changed images/krux-sim krux)"
            echo "jade=$(changed images/jade-sim jade)"
            echo "seedtool=$(changed images/seedtool seedtool)"
          } | tee -a "$GITHUB_OUTPUT"  # -a: el paso anterior ya escribio ahi

  # El simulador compila el firmware: runners nativos por arquitectura, no QEMU.
  simulator:
    needs: versions
    if: needs.versions.outputs.build_sim == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/ccq1-simulator
          platforms: ${{ matrix.platform }}
          build-args: FIRMWARE_TAG=${{ needs.versions.outputs.firmware_tag }}
          cache-from: type=gha,scope=sim-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=sim-${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/ccq1-simulator,push-by-digest=true,name-canonical=true,push=true

      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  simulator-manifest:
    needs: [versions, simulator]
    if: needs.versions.outputs.build_sim == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/ccq1-simulator
          SIM_VERSION: ${{ needs.versions.outputs.sim_version }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${SIM_VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${SIM_VERSION}"

  # Solo COPY sobre nginx:alpine: no necesita runner nativo ni QEMU.
  web:
    needs: versions
    if: needs.versions.outputs.build_web == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/ccq1-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/ccq1-web:${{ needs.versions.outputs.sim_version }}

  # Simulador de SeedSigner: solo clona el firmware (python puro) e instala wheels,
  # asi que buildx con QEMU alcanza y no hacen falta runners por arquitectura.
  seedsigner:
    needs: versions
    if: needs.versions.outputs.build_seedsigner == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/seedsigner-sim
          platforms: linux/amd64,linux/arm64
          build-args: SEEDSIGNER_TAG=${{ needs.versions.outputs.seedsigner_tag }}
          cache-from: type=gha,scope=seedsigner
          cache-to: type=gha,mode=max,scope=seedsigner
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/seedsigner-sim:${{ needs.versions.outputs.seedsigner_tag }}

  # Simulador de Krux: los mocks de upstream son python puro y lo unico nativo es el modulo
  # uUR (un .c chico), asi que QEMU alcanza igual que con seedsigner.
  krux:
    needs: versions
    if: needs.versions.outputs.build_krux == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/krux-sim
          platforms: linux/amd64,linux/arm64
          build-args: KRUX_TAG=${{ needs.versions.outputs.krux_tag }}
          cache-from: type=gha,scope=krux
          cache-to: type=gha,mode=max,scope=krux
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/krux-sim:${{ needs.versions.outputs.krux_version }}

  # Simulador de Jade: el firmware de ESP32 se compila en un stage fijado a amd64 (la
  # toolchain que publica Blockstream solo existe para esa arquitectura) y el binario que
  # sale de ahi sirve para las dos plataformas, porque lo ejecuta qemu. Lo unico que corre
  # emulado es el stage final -apt, curl y wheels-, asi que un runner amd64 alcanza.
  jade:
    needs: versions
    if: needs.versions.outputs.build_jade == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cada release de Jade se compila con la imagen de toolchain que ella misma declara:
      # con la de otra version el firmware no linkea. El digest sale del tag, asi que el PR
      # de bump no tiene que acordarse de actualizarlo.
      - id: builder
        env:
          TAG: ${{ needs.versions.outputs.jade_tag }}
        run: |
          set -euo pipefail
          digest=$(curl -fsSL "https://raw.githubusercontent.com/Blockstream/Jade/${TAG}/Dockerfile.qemu" \
                   | sed -n 's|^FROM blockstream/jade_builder@||p')
          case "$digest" in sha256:*) ;; *) echo "no encontre el builder del tag ${TAG}" >&2; exit 1;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: images/jade-sim
          platforms: linux/amd64,linux/arm64
          build-args: |
            JADE_VERSION=${{ needs.versions.outputs.jade_tag }}
            JADE_BUILDER=${{ steps.builder.outputs.digest }}
          cache-from: type=gha,scope=jade
          cache-to: type=gha,mode=max,scope=jade
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/jade-sim:${{ needs.versions.outputs.jade_tag }}

  # Bitcoin Seed Tool: la imagen es nginx + un HTML descargado y verificado por firma.
  # Nada compila, asi que no hace falta QEMU: el stage que descarga corre en la plataforma
  # del builder y el resto es COPY.
  seedtool:
    needs: versions
    if: needs.versions.outputs.build_seedtool == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/seedtool
          platforms: linux/amd64,linux/arm64
          build-args: SEEDTOOL_TAG=${{ needs.versions.outputs.seedtool_tag }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.versions.outputs.owner }}/seedtool:${{ needs.versions.outputs.seedtool_tag }}

  # Umbrel exige el digest del indice multi-arch pinneado en el compose. Lo escribe el CI
  # para que no haya que copiarlo a mano ni se desincronicen las dos apps (comparten ccq1-web).
  pin:
    needs: [versions, simulator-manifest, web, seedsigner, krux, jade, seedtool]
    # Corre aunque se hayan salteado builds (los jobs que no cambiaron quedan "skipped"),
    # pero no si alguno fallo. El sed es idempotente: para una imagen que no se reconstruyo,
    # su tag en GHCR sigue apuntando al digest que ya esta en el compose.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    # Serializa solo el pin, no los builds (que tardan ~1 h): dos corridas escribiendo
    # los mismos docker-compose.yml se pisaban y la segunda fallaba al pushear.
    concurrency:
      group: pin-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin digests in docker-compose.yml
        env:
          OWNER: ${{ needs.versions.outputs.owner }}
        run: |
          set -euo pipefail
          # Recorre todas las imagenes de versions.yml, asi una app nueva no necesita tocar esto.
          yq '.firmwares[] | .version as $v | .images[] | $v + " " + .' versions.yml |
          while read -r tag repo; do
            image="${REGISTRY}/${OWNER}/${repo}"
            digest=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')
            case "$digest" in sha256:*) ;; *) echo "digest raro para ${image}:${tag}: $digest" >&2; exit 1;; esac
            echo "${image}:${tag}@${digest}"
            sed -i -E "s#(image: )${image}:.*#\\1${image}:${tag}@${digest}#" nubeapps-*/docker-compose.yml
          done

      - name: Commit
        run: |
          if git diff --quiet -- nubeapps-*/docker-compose.yml; then
            echo "Los digests ya estaban al dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "CI: pinnear digests de las imagenes recien publicadas"
          # Aun serializado, la rama pudo avanzar durante el build (merge, otro workflow).
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${{ github.ref_name }}"
          done
          git push
