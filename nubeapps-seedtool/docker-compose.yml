version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: nubeapps-seedtool_web_1
      APP_PORT: 80

  # Un unico servicio: nginx sirviendo el index.html firmado del release de upstream.
  # La app no guarda nada, asi que no hay bind mounts ni usuario 1000:1000 que respetar.
  web:
    image: ghcr.io/johnysats/seedtool:2.3.0@sha256:54741adecad2135d4ae17a1cbe76ee381b361146308179952856d7b9daf78742
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
