map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # DNS embebido de Docker resuelto en cada request: si nginx arranca antes que sim/files
    # (o si se recrean con otra IP) no queda roto ni falla el arranque.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # PSBTs y archivos grandes hacia la MicroSD simulada
    client_max_body_size 512m;

    # filebrowser corre con --baseurl /files, asi que el prefijo no se recorta
    location /files {
        set $upstream_files http://files:80;
        proxy_pass $upstream_files$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # noVNC: websockify sirve el estatico y el websocket en el mismo puerto
    location / {
        set $upstream_sim http://sim:6080;
        proxy_pass $upstream_sim$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
