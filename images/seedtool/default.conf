server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 13 MB de HTML: gzip baja la primera carga a ~3 MB.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/plain application/javascript application/json;

    # Copia para uso offline servida desde el propio Umbrel: el boton "download" de upstream
    # apunta a GitHub, que en una maquina airgapped no sirve.
    #
    # A proposito NO pasa por sub_filter: lo que se baja de aca es el archivo del release tal
    # cual, asi su sha256 sigue coincidiendo con el que publica y firma Bitcoin QnA.
    location = /download {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
        add_header Content-Disposition 'attachment; filename="seedtool-__SEEDTOOL_TAG__.html"';
    }

    # Lo que agrega este paquete: el shim de contexto no seguro y la capa ES. Se sirven
    # aparte y se inyectan en la pagina, que queda intacta.
    location /extra/ {
        alias /usr/share/nginx/extra/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
        sub_filter '</body>' '<script src="/extra/compat.js"></script><script src="/extra/i18n.js"></script></body>';
        sub_filter_once on;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }
}
