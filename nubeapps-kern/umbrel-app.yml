id: nubeapps-kern
category: Bitcoin
name: Kern
version: "0.0.20"
tagline: The experimental Kern signer in your browser, no ESP32-P4 device / El firmware experimental de Kern en tu navegador, sin dispositivo ESP32-P4
description: >-
  WARNING: Kern is a research and development project, not a product. Its own author publishes
  it unaudited and built for testnet, and this is a simulator on top of that: it is not a secure
  wallet, it does not run air-gapped, and the entropy of any seed it generates is not safe to
  hold funds. Never import a real seed and never sign with real funds.


  Kern is an air-gapped Bitcoin signer written in C for the ESP32-P4, by odudex, the main
  contributor to Krux: same idea, a simplified interface, and libwally underneath, the same
  crypto library Blockstream Jade uses. It signs PSBTs for single-sig, multisig and miniscript
  policies, on native segwit and taproot.


  This app runs the desktop simulator that ships with the firmware (upstream, unpatched) and
  shows it in your browser: the device is all touchscreen, so click straight on the screen and
  drag to swipe.


  Kern takes input two ways, and the simulator has both:


  - MicroSD: the file explorer at /files is what the device sees as /sdcard. Signed PSBTs, and
    the mnemonic and descriptor backups the device writes, come back to that same folder

  - Camera: there is no webcam in a container, so a virtual one shows the device a QR made from
    the file you pick on the page (animated in parts when it is a PSBT). Point it at a file and
    go to Scan, or to Load Mnemonic > From QR Code


  Two things the real hardware has and the simulator does not: what you leave in the MicroSD
  folder is stored unencrypted on your Umbrel, and the PIN protects nothing, because the key
  that would live in the chip's eFuse is a fixed constant here (so the anti-phishing words are
  not the ones a real device would show you either).


  --- En espanol ---


  ATENCION: Kern es un proyecto de investigacion y desarrollo, no un producto. Su propio autor
  lo publica sin auditar y pensado para testnet, y esto ademas es un simulador: no es una
  billetera segura, no corre en hardware air-gapped y la entropia de las seeds que genere no
  sirve para custodiar fondos. Nunca importes una seed real ni firmes con fondos reales.


  Kern es un firmware air-gapped para firmar Bitcoin, escrito en C para el ESP32-P4 por odudex,
  el principal colaborador de Krux: la misma idea, una interfaz simplificada y libwally por
  debajo, la misma libreria de criptografia que usa Blockstream Jade. Firma PSBTs de single-sig,
  multisig y politicas miniscript, en native segwit y taproot.


  Esta app corre el simulador de escritorio que trae el propio firmware (upstream, sin parches)
  y lo muestra en el navegador: el dispositivo es todo pantalla tactil, asi que haces click
  directo sobre ella y arrastras para hacer swipe.


  Kern recibe datos por dos vias, y el simulador tiene las dos:


  - MicroSD: el explorador de archivos en /files es lo que el dispositivo ve como /sdcard. Los
    PSBT firmados, y los backups de mnemonics y descriptores que escribe el dispositivo, vuelven
    a esa misma carpeta

  - Camara: en un contenedor no hay webcam, asi que una virtual le muestra al dispositivo un QR
    armado con el archivo que elegis en la pagina (animado por partes si es un PSBT). Apuntala a
    un archivo y entra a Scan, o a Load Mnemonic > From QR Code


  Dos cosas que el hardware real tiene y el simulador no: lo que dejes en la carpeta de la
  MicroSD queda guardado sin cifrar en tu Umbrel, y el PIN no protege nada, porque la clave que
  viviria en el eFuse del chip aca es una constante fija (asi que las palabras anti-phishing
  tampoco son las que te mostraria un dispositivo de verdad).
releaseNotes: >-
  Two upstream firmware updates (0.0.19 and 0.0.20):


  - Descriptor backups encrypted with BIP-138: after loading a descriptor you can save it on
    flash or SD card under a name, encrypted to the descriptor's own public keys. Only
    approved backups that pass keyed validation are restored.

  - Animated QR exports stream their frames instead of caching up to 100, so large exports
    are no longer capped. Non-UR sequences also get playback controls (pause, step, jump)
    and a frame counter.

  - A keyboard shortcut loads a QR straight into the BIP-39 passphrase and KEF key fields,
    so a long secret can come from a QR instead of being typed.


  --- En espanol ---


  Dos actualizaciones de firmware upstream (0.0.19 y 0.0.20):


  - Backups de descriptores cifrados con BIP-138: despues de cargar un descriptor podes
    guardarlo en flash o MicroSD con un nombre, cifrado con las propias claves publicas del
    descriptor. Solo se restauran los backups aprobados que pasan la validacion con clave.

  - Las exportaciones en QR animado ahora transmiten los frames en vez de cachear hasta 100,
    asi que las exportaciones grandes ya no tienen ese limite. Las secuencias no-UR tambien
    tienen controles de reproduccion (pausa, paso a paso, saltar) y un contador de frames.

  - Un atajo de teclado carga un QR directo en los campos de passphrase BIP-39 y clave KEF,
    asi un secreto largo puede venir por QR en vez de tipeado.
